<meta charset="utf-8">
<title>Brightside PM Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: HUD strip (day, live clock, meters) over a two-pane stage — the walkable office canvas left, goals + phone right; laptop/dialog/scene overlays sit on top. */
:root{
  --bg:#E8ECF2; --surface:#FFFFFF; --sunk:#E1E6EE; --ink:#152238; --muted:#566379; --line:#CFD7E3;
  --accent:#F0A43A; --accent-ink:#2A1B05; --accent-soft:#FCEBD0;
  --link:#2D5BD8; --good:#1E8556; --good-soft:#DDF2E7; --bad:#C2412D; --bad-soft:#F8E1DC; --warn:#A86A00;
  --scrim:rgba(14,21,34,.55);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1522; --surface:#162032; --sunk:#1D2A40; --ink:#E6EBF3; --muted:#9BA7BB; --line:#2A3852;
  --accent:#F4B04F; --accent-ink:#241603; --accent-soft:#3A2C17;
  --link:#8CAEFF; --good:#4CC28A; --good-soft:#173527; --bad:#F07A66; --bad-soft:#3E1F1A; --warn:#E3A93C;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1522; --surface:#162032; --sunk:#1D2A40; --ink:#E6EBF3; --muted:#9BA7BB; --line:#2A3852;
  --accent:#F4B04F; --accent-ink:#241603; --accent-soft:#3A2C17;
  --link:#8CAEFF; --good:#4CC28A; --good-soft:#173527; --bad:#F07A66; --bad-soft:#3E1F1A; --warn:#E3A93C;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700} h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:6px}
.eyebrow{font:500 .7rem/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;background:var(--ink);color:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.term{background:none;border:0;padding:0;border-bottom:2px dotted var(--link);font:inherit;color:inherit}
.fb{border-left:3px solid var(--line);padding:4px 10px;font-size:.9rem}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.delta{font:500 .72rem var(--mono);padding:2px 6px;border-radius:5px;display:inline-block}
.delta.up{background:var(--good-soft);color:var(--good)} .delta.down{background:var(--bad-soft);color:var(--bad)}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hud-in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;max-width:1400px;margin:0 auto}
.brand{font:800 1rem var(--display);display:flex;gap:8px;align-items:center}
.sun{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 50% 70%,var(--accent) 55%,transparent 56%);border-bottom:3px solid var(--ink)}
.clock{display:flex;align-items:center;gap:6px}
.clock .t{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:6px;padding:4px 9px;min-width:132px;text-align:center}
.clock .t.paused{background:var(--accent-soft)}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:.8rem}
.ib:hover{border-color:var(--ink)} .ib.on{background:var(--ink);color:var(--surface)}
.meters{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.meter{display:grid;grid-template-columns:auto 30px;gap:1px 6px;font-size:.7rem;color:var(--muted);align-items:center}
.meter b{font:500 .72rem var(--mono);color:var(--ink);text-align:right}
.meter i{grid-column:1/3;display:block;width:88px;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i u{display:block;height:100%;background:var(--ink);transition:width .5s}

/* Stage */
.stage{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:960px){.stage{grid-template-columns:1fr}}
.office{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#2B354A}
#cv{display:block;width:100%;height:auto;touch-action:none;cursor:pointer}
.interact{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);border:0;border-radius:999px;padding:9px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.interact kbd{font:500 .72rem var(--mono);background:rgba(0,0,0,.12);padding:1px 6px;border-radius:4px;margin-right:6px}
.where{position:absolute;left:10px;top:10px;font:500 .7rem var(--mono);background:rgba(20,28,44,.75);color:#fff;padding:4px 8px;border-radius:6px;letter-spacing:.05em}
.side{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.goal{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:.9rem;align-items:start}
.goal .box{width:16px;height:16px;border-radius:4px;border:2px solid var(--line);margin-top:2px}
.goal.done .box{background:var(--good);border-color:var(--good)} .goal.done span{color:var(--muted);text-decoration:line-through}
.goal.failed .box{background:var(--bad);border-color:var(--bad)} .goal.failed span{color:var(--bad)}
.goal.next span{font-weight:700}
.goal em{font-size:.75rem;color:var(--muted);font-style:normal}
.phone{max-height:420px;overflow-y:auto;display:grid;gap:8px}
.pm{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;font-size:.88rem}
.pm.unread{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pm-h{display:flex;gap:6px;align-items:baseline}
.pm-h b{font-size:.85rem} .pm-h span{font:500 .68rem var(--mono);color:var(--muted);margin-left:auto}
.pm .reply{background:var(--sunk);border-radius:8px;padding:6px 9px;font-size:.84rem}
.pm .opt{font-size:.84rem;padding:7px 10px}
.badge{background:var(--bad);color:#fff;border-radius:999px;font:500 .68rem var(--mono);padding:1px 7px}

/* shared option buttons */
.opts{display:grid;gap:7px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.pick{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(760px,100%);max-height:calc(100% - 16px);overflow-y:auto;padding:22px;display:grid;gap:14px}
.explain{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.92rem}
.explain b{font-family:var(--display)}
.speaker{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 .85rem var(--display);color:#fff}
.say{background:var(--sunk);border-radius:4px 12px 12px 12px;padding:10px 13px;min-width:0}
.say .who{font-weight:700;font-size:.85rem}
.say .who small{font-weight:400;color:var(--muted);margin-left:6px}
.dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:min(720px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.25)}

/* laptop */
.pc{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);max-width:1200px;margin:0 auto}
.pc-top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.pc-top b{font-family:var(--display)}
.pc-top .sp{margin-left:auto}
.pc-body{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:0}
.dock{border-right:1px solid var(--line);padding:10px;display:grid;gap:4px;align-content:start;background:var(--surface)}
.dock button{text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center}
.dock button:hover{background:var(--sunk)} .dock button.on{background:var(--ink);color:var(--surface)}
.dock .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:auto}
.app{overflow-y:auto;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
@media (max-width:700px){.pc{inset:calc(56px + env(safe-area-inset-top,0px)) 0 0}.pc-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dock{grid-auto-flow:column;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}}

/* calendar */
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:52px repeat(5,minmax(110px,1fr));min-width:620px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .hd{background:var(--sunk);font-weight:700;font-size:.82rem;padding:6px;text-align:center;border-left:1px solid var(--line)}
.cal .hr{font:500 .68rem var(--mono);color:var(--muted);padding:4px;border-top:1px solid var(--line);height:44px}
.cal .cell{border-top:1px solid var(--line);border-left:1px solid var(--line);height:44px;position:relative;padding:3px}
.cal .ev{position:absolute;inset:3px;border-radius:6px;font-size:.72rem;padding:3px 6px;line-height:1.2;background:var(--sunk);border-left:3px solid var(--muted);overflow:hidden}
.cal .ev.me{background:var(--accent-soft);border-color:var(--accent)}
.cal .ev.today{outline:2px solid var(--ink)}
.slot-free{position:absolute;inset:3px;border:2px dashed var(--good);border-radius:6px;background:var(--good-soft);color:var(--good);font-size:.72rem;font-weight:700}
/* analytics */
.an-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.an-controls label{font-size:.78rem;color:var(--muted);display:grid;gap:4px}
.an-chart{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.an-chart svg{width:100%;height:auto;display:block}
.pins{display:grid;gap:6px}
.pinrow{display:flex;gap:8px;align-items:center;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.pinrow .s{font:500 .66rem var(--mono);padding:2px 6px;border-radius:4px;margin-left:auto}
.s-strong{background:var(--good-soft);color:var(--good)} .s-weak{background:var(--bad-soft);color:var(--bad)}
/* drag */
[data-drag]{touch-action:none;user-select:none;cursor:grab}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;opacity:.9;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.dragging{opacity:.35}
.sel{outline:3px solid var(--link);outline-offset:1px}
.sticky{background:#FFE9A8;color:#2B2410;border-radius:4px;padding:8px 10px;font-size:.82rem;line-height:1.35;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.sticky small{display:block;font:500 .62rem var(--mono);opacity:.7;margin-top:4px;text-transform:uppercase}
.board-notes{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;border:1px dashed var(--line);border-radius:10px;padding:10px}
.board-notes .sticky{max-width:230px}
.clusters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.zone{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px;display:grid;gap:6px;align-content:start;background:var(--sunk)}
.zone h4{margin:0;font:700 .82rem var(--display)}
.zone.hot{outline:2px dashed var(--link)}
.matrix{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:1fr 1fr 24px;gap:6px}
.matrix .ax{font:500 .66rem var(--mono);color:var(--muted);display:grid;place-items:center;text-transform:uppercase}
.matrix .ax.y{writing-mode:vertical-rl;transform:rotate(180deg);grid-row:1/3}
.matrix .ax.x{grid-column:2/4}
.quad{min-height:130px}
.quad p{font-size:.72rem;color:var(--muted)}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.84rem;font-weight:700}
.idea small{display:block;font-weight:400;color:var(--muted)}
.idea-info{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.88rem;display:grid;gap:4px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.84rem;display:flex;gap:8px;align-items:center}
.ticket .pts{margin-left:auto;font:500 .72rem var(--mono);background:var(--sunk);border-radius:999px;padding:2px 8px}
.sprint-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.sprint-cols{grid-template-columns:1fr}}
.cap{display:grid;gap:4px}
.cap i{display:block;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.cap i u{display:block;height:100%;background:var(--good)} .cap.over i u{background:var(--bad)}
.field{display:grid;gap:5px} .field label{font-weight:700;font-size:.92rem} .field .hint{font-size:.8rem;color:var(--muted)}
.pill{font:500 .68rem var(--mono);padding:2px 8px;border-radius:999px}
.p2{background:var(--good-soft);color:var(--good)} .p1{background:var(--accent-soft);color:var(--warn)} .p0{background:var(--bad-soft);color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.check input{margin-top:3px;width:auto}
.check.disabled{opacity:.5}
/* chat */
.chat{display:grid;gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.line{display:flex;gap:6px;align-items:flex-end}
.line.me{justify-content:flex-end}
.line .t{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--sunk);white-space:pre-wrap}
.line.me .t{background:var(--ink);color:var(--surface)}
.pinq{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.72rem;padding:3px 9px;white-space:nowrap}
.pinq.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qtag{font:500 .62rem var(--mono);display:block;opacity:.75;text-transform:uppercase;margin-top:3px}
.cards{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.qcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.86rem}
.qcard:hover:not(:disabled){border-color:var(--ink)} .qcard:disabled{opacity:.35}
.video{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:10px;background:#1E2738;color:#fff;aspect-ratio:16/8;display:grid;place-items:center;position:relative;max-width:100%}
.tile span{position:absolute;left:8px;bottom:6px;font:500 .7rem var(--mono);opacity:.8}
.tile .av{width:52px;height:52px;font-size:1.1rem}
/* coach */
.coach-ring{position:fixed;z-index:60;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(10,15,25,.55);pointer-events:none;transition:all .25s}
.coach{position:fixed;z-index:61;width:min(340px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.coach .eyebrow{color:var(--warn)}
/* misc */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:.86rem;z-index:90;max-width:calc(100% - 32px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:80;display:grid;grid-template-rows:auto auto 1fr;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;box-shadow:-12px 0 30px rgba(0,0,0,.15)}
.drawer dl{overflow-y:auto;margin:0;display:grid;gap:10px;align-content:start}
.drawer dt{font:700 .98rem var(--display)} .drawer dd{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.drawer .hl{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.bigm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bigm div{border:1px solid var(--line);border-radius:10px;padding:10px}
.bigm b{display:block;font:800 1.7rem var(--display)}
.daygoals{display:grid;gap:4px;font-size:.88rem}
.intro-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:700px){.intro-grid{grid-template-columns:1fr}}
.keys{display:grid;gap:6px;font-size:.88rem}
.keys kbd{font:500 .72rem var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.fb-text{line-height:2.4}
.bl{width:auto;display:inline-block;padding:3px 6px;margin:0 2px;border-radius:6px;font-size:.92rem;max-width:100%}
input.bl{width:72px;text-align:center}
.bl-ok{border-color:var(--good)!important;background:var(--good-soft)} .bl-no{border-color:var(--bad)!important;background:var(--bad-soft)}
.bl-ans{font:500 .72rem var(--mono);background:var(--good-soft);color:var(--good);border-radius:4px;padding:1px 6px;margin-right:4px;white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start} .cmp .stack{align-content:start} @media (max-width:700px){.cmp{grid-template-columns:1fr}}
.doc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:.9rem;min-height:80px}
.doc.model{background:var(--accent-soft);border-color:transparent}
.ordlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ordlist li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
.ordlist li .num{font-weight:700;color:var(--muted);min-width:18px}
.ordlist li .mv{margin-left:auto;display:flex;gap:4px}
.timer{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden} .timer u{display:block;height:100%;background:var(--bad);transition:width .2s linear}
.price-ctl input[type=range],.exp input[type=range]{width:100%;accent-color:var(--accent)}
table.res{border-collapse:collapse;font-size:.9rem} table.res td,table.res th{padding:5px 12px;border-bottom:1px solid var(--line);text-align:left}
.dash2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card-w{border:1px solid var(--line);border-radius:10px;padding:14px}
.sheet.home{width:min(1000px,100%)}
.weeks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.wk{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.wk h2{font-size:1.25rem}

<script>
/* ================= Glossary ================= */
const G = {
  pm:["Product Manager (PM)","Decides what the team builds next and why. You don't write code or manage the engineers; you make sure the team solves a real customer problem that's worth solving."],
  stakeholder:["Stakeholder","Anyone who cares about the outcome: customers, the CEO, engineers, designers, sales, support."],
  standup:["Standup","A short daily team check-in. Each person shares what they did, what's next, and what's blocking them."],
  blocker:["Blocker","Something stopping a teammate from making progress. Removing blockers is a big part of a PM's day."],
  churn:["Churn rate","Customers who cancel in a month ÷ customers at the start of that month. 70 out of 1,000 = 7%."],
  interview:["Customer interview","A short conversation about a customer's real experience. You're there to learn, not to sell."],
  open:["Open question","Can't be answered yes/no and doesn't hint at an answer. \"Walk me through what happened when…\""],
  leading:["Leading question","Suggests the answer you want (\"Was it the price?\"). People often agree just to be polite."],
  affinity:["Affinity mapping","Grouping notes by theme so patterns stand out. The biggest pile often points at the real problem."],
  insight:["Insight","Something true you learned about customers that changes what you'd do."],
  metric:["Metric","A number you track to see how something is going."],
  segment:["Segment","A group of customers that share something (size, features used). Splitting by segment reveals what averages hide."],
  hypothesis:["Hypothesis","Your best guess, written so it can be tested: \"We believe X because Y. We'll know we're right if Z.\""],
  evidence:["Evidence","Facts that support a claim: numbers, charts, customer quotes."],
  matrix:["Priority matrix","A 2×2 grid of impact (how much it helps) vs effort (how much work). Quick wins sit top-left."],
  sprint:["Sprint","A fixed period, usually 2 weeks, where the team commits to a set of work."],
  points:["Story points","A rough size for a piece of work. Teams learn how many points they can finish per sprint (their capacity)."],
  capacity:["Capacity","How much work the team can realistically take on in a sprint."],
  backlog:["Backlog","The list of all work the team might do, in priority order."],
  rollout:["Staged rollout","Releasing to a small % of customers first, watching the numbers, then expanding."],
  monitoring:["Monitoring","Dashboards and alerts that tell you if something breaks. Without it, problems hide for weeks."],
  prd:["PRD","Product Requirements Document: what we're building, for whom, why, and how we'll know it worked."],
  successmetric:["Success metric","The specific number that proves a project worked, with a target and deadline."],
  scope:["Scope","What's included in a project. Writing what's out of scope prevents it from growing forever."],
};
const t = (k,label) => `<button class="term" data-act="term" data-term="${k}">${label||G[k][0]}</button>`;

/* ================= World ================= */

"#wwwwwww#ccccccccc#bbb#KKKK..#",
"#wwDDwww#ccccccccc#bbb#......#",
"#wwwwwww#ccTTTTTcc#bDb#......#",
"#wwwwwww#ccTTTTTcc#bbb#......#",
"#wwwwwww#ccccccccc#bbb#P.....#",
"####-#######-#######-####-####",
"#............................#",
"#..DD..DD....DD.....DD...DD..#",
"#............................#",
"#............................#",
"#P...........................#",
"#............................#",
"#...........CC...DD..........#",
"#............................#",
"#P..........................P#",
"#............................#",
"##########################-###",

const walk=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!BLOCK.has(tileAt(x,y));
const ROOMS={
  ceo:{x0:1,y0:1,x1:7,y1:5,label:"Dana's office"},
  meeting:{x0:9,y0:1,x1:17,y1:5,label:"Lighthouse meeting room"},

const SEATS={meet:[[11,2],[13,2],[15,2],[11,5],[14,5]]};

/* ================= State ================= */
const KEY="brightside-pm-v2";
const METERS=[["trust","Trust","Does the team believe in you?"],["customers","Customers","Are customers better off?"],["velocity","Velocity","Is the team building useful things?"],["revenue","Revenue","Is the business healthy?"]];
const DAYNAMES=["Monday","Tuesday","Wednesday","Thursday","Friday"];
function fresh(){return{
  stage:"intro", week:0, day:0, min:540, paused:false, speed:1,
  meters:{trust:50,customers:50,velocity:50,revenue:50},
  goals:{}, fired:{}, attended:{}, missed:{}, flags:{}, msgs:[], seen:{}, daylog:{},
  notes:[], clusters:{}, topInsight:null, pins:[], hyp:{}, matrix:{}, top:null, sprint:{}, prd:{}, release:{rollout:10}, danaChat:[], interview:[],
};}
let S=fresh();
const loadKey=k=>{ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } };
let CHECKPOINT=loadKey(KEY+"-cp"), AUTO=loadKey(KEY+"-auto");
function checkpoint(){ S.pos=[P.x,P.y]; try{ localStorage.setItem(cpKey(S.week), JSON.stringify(S)); }catch{} CHECKPOINT=JSON.parse(JSON.stringify(S)); saveNow(); }
function saveNow(){
  if(S.stage!=="play") return;
  S.pos=[P.x,P.y]; S.savedAt=Date.now();
  const el=document.getElementById("saved");
  try{ localStorage.setItem(slotKey(S.week), JSON.stringify(S)); if(el) el.textContent="Saved "+fmt(S.min); }
  catch{ if(el) el.textContent="Can't autosave here. Use Save file."; }
}
setInterval(saveNow,5000);
addEventListener("pagehide",saveNow);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveNow(); });
const UI={pc:null, app:null, dialog:null, scene:null, coach:null, summary:null, sel:null, near:null};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=m=>{m=Math.floor(m);let h=Math.floor(m/60),mm=m%60;const ap=h>=12?"pm":"am";h=h%12||12;return `${h}:${String(mm).padStart(2,"0")} ${ap}`;};
const mname=k=>METERS.find(x=>x[0]===k)[1];
const dtag=(k,d)=>`<span class="delta ${d>0?"up":"down"}">${d>0?"+":""}${d} ${mname(k)}</span>`;
function bump(k,d,why){
  if(!d) return;
  S.meters[k]=Math.max(0,Math.min(100,S.meters[k]+d));
  (S.daylog[S.day] ||= []).push([k,d,why]);
  toast(`${d>0?"+":""}${d} ${mname(k)} · ${why}`); renderHUD();
}
function fx(list){ (list||[]).forEach(([k,d,w])=>bump(k,d,w)); }
let toastT;
function toast(m){ const r=document.getElementById("toast-root"); r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>r.innerHTML="",2800); }
function goal(id,st="done"){ if(S.goals[id]) return; S.goals[id]=st; renderSide(); if(st==="done") toast("Goal complete ✓"); }

/* ================= Claude ================= */
let sample=null, aiState="checking";
(async()=>{ try{ if(window.claude&&window.claude.use) sample=await window.claude.use("sample"); }catch{} aiState=sample?"on":"off"; renderHUD(); if(S.stage==="intro") renderHome(); })();
let NOAI=false; try{ NOAI=!!localStorage.getItem(KEY+"-noai"); }catch{}
const aiOn=()=>aiState==="on"&&!NOAI;
setTimeout(()=>{ if(aiState==="checking"){aiState="off";renderHUD();if(S.stage==="intro")renderHome();} },11000);
function aiFail(e){
  const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ aiState="off"; sample=null; renderHUD(); return "AI characters are off for this page, so we switched to scripted replies."; }
  if(c==="rate_limited") return "Claude is busy or you've hit a usage limit. Wait a minute and try again.";
  if(c==="session_expired") return "Your Claude session expired. Sign in again, then retry.";
  return "Couldn't reach Claude just now. Try again.";
}

/* ================= Messages (phone) ================= */
const MSG={
  mon_dana:{from:"dana",text:"Welcome to Brightside! Bad timing though: churn has more than doubled since summer and the board meets in 3 weeks. I need a plan by Friday. Slotwise just launched an AI booking assistant… maybe that's our answer?",
    choices:[

      {l:"Got it.",fx:[["trust",-2,"vague reply to the CEO"]],r:"…Okay. Friday.",goal:"mon_slack"}]},

    choices:[

    choices:[

      {l:"Still digging.",fx:[["trust",-1,"no story yet"]],r:"Dig faster."}]},
  thu_maya:{from:"maya",text:"Big day. Prioritize the ideas on the Board, then sprint planning at 2. Expect Dana to push for AI. Bring your evidence."},
  fri_maya:{from:"maya",text:"Last day! Ship the fix, write the PRD, and present to Dana at 3pm in her office."},
  fri_leo_yes:{from:"leo",text:"SMS fix is built and tested. Ready to ship when you are (Release app on your laptop)."},
  fri_leo_no:{from:"leo",text:"Heads up: the SMS fix wasn't in the sprint, so there's nothing ready to ship. 😬"},
  missed:{from:"maya",text:""},
};
function pushMsg(id, extra){
  S.msgs.push({id, t:S.min, day:S.day, picked:null, unread:true, text:extra||null});
  const m=MSG[id]; toast(`${NPCS[m.from].name.split(" ")[0]}: ${(extra||m.text).slice(0,60)}${(extra||m.text).length>60?"…":""}`);
  renderSide();
}

function tileOf(e){ return [Math.floor(e.x/TS),Math.floor(e.y/TS)]; }
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty) return [];
  const prev=new Map(),k=(x,y)=>y*W+x,q=[[sx,sy]]; prev.set(k(sx,sy),null);
  while(q.length){ const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy,kk=k(nx,ny);
      if(prev.has(kk)||!walk(nx,ny)) continue; prev.set(kk,[x,y]);
      if(nx===tx&&ny===ty){ const path=[[nx,ny]]; let p=[x,y]; while(p&&!(p[0]===sx&&p[1]===sy)){ path.unshift(p); p=prev.get(k(p[0],p[1])); } return path; }
      q.push([nx,ny]); } }
  return null;
}
function nearOpen(tx,ty,fx,fy){
  if(walk(tx,ty)) return [tx,ty];
  let best=null,bd=1e9;
  for(let r=1;r<=2&&!best;r++) for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){ const x=tx+dx,y=ty+dy; if(!walk(x,y)) continue; const d=Math.hypot(x-fx,y-fy)+Math.hypot(dx,dy)*2; if(d<bd){bd=d;best=[x,y];} }
  return best;
}
function walkPlayerTo(tx,ty,pending){
  const [sx,sy]=tileOf(P); const tgt=nearOpen(tx,ty,sx,sy); if(!tgt) return;
  const path=bfs(sx,sy,tgt[0],tgt[1]); if(!path) return;
  P.path=path; P.pending=pending||null;
  if(!path.length && pending) interact(pending);
}
function npcGo(id,tile,cb){ const n=N[id]; const [sx,sy]=tileOf(n); const tgt=nearOpen(tile[0],tile[1],sx,sy); n.path=bfs(sx,sy,tgt[0],tgt[1])||[]; n.cb=cb||null; if(!n.path.length&&cb){n.cb=null;cb();} }

function walkHome(ids){ ids.forEach(id=>npcGo(id,NPCS[id].home)); }
function collides(x,y){ const r=9; return [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]].some(([a,b])=>!walk(Math.floor(a/TS),Math.floor(b/TS))); }
function step(ent,speed,dt){

}

let last=performance.now(), lastMin=-1;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S.stage==="play"){
    const frozen = S.paused||UI.dialog||UI.scene||UI.coach||UI.summary||(UI.pc&&UI.pc.locked);
    if(!frozen){
      advance(dt*S.speed);
      if(!UI.pc){
        let vx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0), vy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
        if(vx||vy){ P.path=[]; P.pending=null; const l=Math.hypot(vx,vy), s=150*dt; const nx=P.x+vx/l*s, ny=P.y+vy/l*s; if(!collides(nx,P.y)) P.x=nx; if(!collides(P.x,ny)) P.y=ny; }
        else if(step(P,150,dt) && P.pending) interact(P.pending);
        checkRooms();
      }
      for(const id in N){ const n=N[id]; if(step(n,110,dt)&&n.cb){ const cb=n.cb; n.cb=null; cb(); } }
    }
    const nr=busy()?null:nearest(); const key=nr?nr.kind+nr.id:"";
    if(key!==(UI.near?UI.near.kind+UI.near.id:"")){ UI.near=nr; const b=document.getElementById("interact"); b.hidden=!nr; if(nr) b.innerHTML=`<kbd>E</kbd>${nr.label}`; }
    const rn=roomName(); const we=document.getElementById("where"); if(we.textContent!==rn) we.textContent=rn;
  }
  draw(now);
  requestAnimationFrame(frame);
}
function advance(m){

}
function tickMinute(){

  day.meetings.forEach(m=>{ const k=S.day+":"+m.id, at=m.at();
    if(!S.attended[k]&&!S.missed[k]&&S.min>=at+30){ S.missed[k]=1; goal(m.goal,"failed"); m.miss(); toast("You missed: "+goalText(day.goals.find(g=>g.id===m.goal))); renderSide(); } });
  if(UI.pc && (UI.app==="release"||UI.app==="analytics") && S.flags.shipped) renderApp();

}

      <textarea id="prd-${f[0]}" data-act="prd" data-k="${f[0]}" ${r?"disabled":""}>${esc(S.prd[f[0]]||"")}</textarea>
      ${f[0]==="evidence"&&!r&&S.pins.length?`<div class="row">${S.pins.map((p,i)=>`<button class="ib" data-act="prd-ins" data-i="${i}">+ ${esc(p.label)}</button>`).join("")}</div>`:""}
      ${r&&r.comments&&r.comments[f[0]]?`<p class="fb">${esc(r.comments[f[0]])}</p>`:""}</div>`).join("")}
    ${!r?`<div class="row"><button class="btn primary" data-act="prd-review" ${UI.prdBusy?"disabled":""}>${UI.prdBusy?"Maya is reading…":"Send to Maya for review"}</button></div>`:`<p class="fb ok">${esc(r.overall)}</p>`}
  </div>`;
}
const PRD_FIELDS=[["problem","Problem","What's going wrong, for whom, how big. Don't name a solution."],["users","Who's affected","Which customers, specifically?"],["evidence","Evidence","Numbers and quotes that prove it."],["metric","Success metric","The number that shows it worked, with a target and a deadline."],["inscope","In scope","What we will do."],["outscope","Out of scope","What we're deliberately NOT doing."]];
function heuristicPRD(p){
  const s={},c={},has=(k,re)=>re.test(p[k]||""),len=k=>(p[k]||"").trim().length;
  s.problem=len("problem")<20?0:has("problem",/\b(build|add|switch|implement)\b/i)?1:has("problem",/remind|no-?show|churn/i)?2:1; if(s.problem<2)c.problem="Describe what's wrong (reminders failing, churn up) without naming the fix.";
  s.users=len("users")<5?0:has("users",/small|salon|clinic|1.?5|1,?800/i)?2:1; if(s.users<2)c.users="Name the segment: small businesses using SMS reminders.";
  s.evidence=len("evidence")<20?0:has("evidence",/\d/)&&has("evidence",/%|ticket|survey|deliver|rosa/i)?2:1; if(s.evidence<2)c.evidence="Add numbers: delivery 98% → 79%, churn 8.4% vs 3.0%, 142 tickets.";
  s.metric=len("metric")<10?0:has("metric",/\d/)&&has("metric",/week|month|by |within|dec|nov/i)?2:1; if(s.metric<2)c.metric="Include a number, a target and a deadline.";
  s.inscope=len("inscope")>5?2:0; s.outscope=len("outscope")>5?2:0; if(!s.outscope)c.outscope="Say what you're NOT doing (e.g. the AI assistant).";
  const total=s.problem+s.users+s.evidence+s.metric+Math.round((s.inscope+s.outscope)/2);
  return {scores:s,comments:c,total,overall:total>=9?"This is a PRD I'd send to the CEO.":total>=6?"Good bones. Tighten the sections I flagged.":"A start. Notice where you need specifics and numbers."};
}
async function reviewPRD(){
  let rv=null;
  if(sample&&aiOn()){
    UI.prdBusy=true; renderApp();
    try{ const doc=PRD_FIELDS.map(f=>`## ${f[1]}\n${S.prd[f[0]]||"(empty)"}`).join("\n\n");
      rv=await sample.json(`You are Maya, a kind but rigorous Head of Product, reviewing a one-page PRD by a beginner PM at Brightside (scheduling software for small salons/clinics). Facts they found this week: SMS provider switched Aug 4; reminder delivery fell 98.5% -> 79%; monthly churn 3% -> 7%; small businesses (1-5 staff) churn 9.8%; reminder users churn 8.4% vs 3.0%; reminder tickets 12 -> 142/month; ~1,800 accounts use reminders.

Score each section 0-2 (0 missing/wrong, 1 partial, 2 strong): problem (states the problem without naming a solution), users (specific segment), evidence (concrete numbers/quotes), metric (measurable, target, deadline), inscope, outscope. One-sentence plain-language comment for any section under 2. Then a 2-3 sentence overall note in a warm voice.

Reply with only JSON: {"scores":{"problem":2,"users":2,"evidence":2,"metric":2,"inscope":2,"outscope":2},"comments":{"problem":""},"overall":"..."}

PRD:
${doc}`,{modelTier:"default"});
      if(!rv||!rv.scores) throw {code:"invalid_json"}; rv.comments ||= {};
      const sc=rv.scores; rv.total=(+sc.problem||0)+(+sc.users||0)+(+sc.evidence||0)+(+sc.metric||0)+Math.round(((+sc.inscope||0)+(+sc.outscope||0))/2);
    }catch(e){ rv=null; if(e.code!=="invalid_json") toast(aiFail(e)); }
    UI.prdBusy=false;
  }
  if(!rv) rv=heuristicPRD(S.prd);
  S.prdReview=rv; goal("fri_prd"); bump("trust",(rv.total-5)*2||1,`PRD scored ${rv.total}/10`);
  renderApp();
}

  if(!drag) return; const d=drag; drag=null;

const SEG=[["small","1–5 staff",1600,1.0,1.6],["mid","6–20 staff",700,0.8,0.5],["large","21+ staff",300,0.5,0.2]];
function priceModel(p){
  // p: {flat, tiers, pro}
  let rev=0, lost=0, smallChurn=0;
  const sum=c=>{ let s=0; for(let m=0;m<12;m++) s+=Math.pow(1-c/100,m); return s; };
  for(const [k,,acc,base,sens] of SEG){
    const add=(n,price,c)=>{ rev+=n*price*sum(c); lost+=n*(1-Math.pow(1-c/100,12)); };
    const starterC=base+sens*Math.max(0,p.flat-29)/10;
    if(k==="small") smallChurn=starterC;
    if(p.tiers&&k!=="small"){ const adopt=p.pro<=49?0.7:p.pro<=59?0.55:0.35; const proC=base+sens*0.4*Math.max(0,p.pro-29)/10;
      add(acc*adopt,p.pro,proC); add(acc*(1-adopt),p.flat,starterC); }
    else add(acc,p.flat,starterC);
  }
  return {rev:Math.round(rev), lost:Math.round(lost), smallChurn:+smallChurn.toFixed(1)};
}

WC.w3_notes={title:"Release notes: Brightside Pro",who:"salon and clinic owners with 6+ staff",prompt:"What's new, who it's for, what it costs, and how to get it. Customer language only.",ph:"Introducing Brightside Pro…",

function appDocsW3(){

  if(tab==="research") return tabs+`<h2>Research</h2>
    <div class="card-w stack"><h3>Competitive map: Brightside vs Slotwise</h3><p class="small muted">A <b>competitive analysis</b> shows where you're ahead, level, or behind. Being behind isn't automatically a to-do: it's a question for discovery.</p>${binHTML("w3_comp")}</div>
    ${S.day>=1?`<div class="card-w stack"><h3>Survey draft: going to 2,000 customers</h3><p class="small muted">One bad question can make a whole survey useless. Fix it before it goes out.</p>${spotHTML("w3_survey")}</div>`:""}`;
  if(tab==="spec"){ if(S.day<2) return tabs+`<h2>Spec</h2><p class="muted">Spec day is Wednesday.</p>`;
    return tabs+`<div class="spec stack"><h2>Spec: Waitlist</h2><div class="explain">A <b>user story</b> describes a feature from the user's side: <i>As a [who], I want [what], so that [why].</i> <b>Acceptance criteria</b> are the yes/no checks that define "done".</div>

}
function appBoardW3(){
  const tab=UI.boardTab||"opps";
  const tabs=`<div class="row">${[["opps","Opportunities"],["scope","Scope"],["triage","Triage"]].map(([k,l])=>`<button class="ib ${tab===k?"on":""}" data-act="board-tab" data-t="${k}">${l}</button>`).join("")}</div>`;
  if(tab==="opps"){ if(S.day<1) return tabs+`<h2>Opportunities</h2><p class="muted">Do the customer calls first (Tuesday).</p>`;
    return tabs+`<h2>Opportunity tree</h2><div class="explain">An <b>opportunity solution tree</b> starts from the outcome (more appointments booked), branches into customer <b>problems</b> (opportunities), then into <b>solutions</b>. If a solution has no problem above it, it's a guess.</div>${binHTML("w3_tree")}`; }
  if(tab==="scope"){ if(S.day<2) return tabs+`<h2>Scope</h2><p class="muted">Scoping happens Wednesday.</p>`;
    return tabs+`<h2>Pro launch scope</h2><div class="explain"><b>MoSCoW</b>: Must, Should, Could, Won't. Musts are the things the launch fails without. Keep that list short, or nothing ships on time.</div>${binHTML("w3_scope")}`; }
  if(S.day<3) return tabs+`<h2>Triage</h2><p class="muted">No new bugs yet.</p>`;
  return tabs+`<h2>Bug triage</h2><div class="explain"><b>Triage</b> means sorting by urgency, fast. <b>P0</b>: the core product is broken, or money or data is at risk: drop everything. <b>P1</b>: real harm but limited, fix this sprint. <b>P2</b>: minor, backlog. Some requests deserve a polite "won't fix".</div>${binHTML("w3_triage")}`;
}
function weekReport3(){
  const w=W3(), avg=Math.round(METERS.reduce((a,m)=>a+S.meters[m[0]],0)/4);

}

const slotKey=w=>KEY+"-w"+w, cpKey=w=>KEY+"-cp-w"+w;
let DONE=loadKey(KEY+"-done")||{};
(function migrate(){ const old=loadKey(KEY+"-auto"); if(old&&old.week!=null&&!loadKey(slotKey(old.week))){ try{ localStorage.setItem(slotKey(old.week),JSON.stringify(old)); }catch{} }
  const oc=loadKey(KEY+"-cp"); if(oc&&oc.week!=null&&!loadKey(cpKey(oc.week))){ try{ localStorage.setItem(cpKey(oc.week),JSON.stringify(oc)); }catch{} }
  try{ localStorage.removeItem(KEY+"-auto"); localStorage.removeItem(KEY+"-cp"); }catch{} })();
function markWeekDone(){ const avg=Math.round(METERS.reduce((a,m)=>a+S.meters[m[0]],0)/4); DONE[S.week]={avg,at:Date.now()}; try{ localStorage.setItem(KEY+"-done",JSON.stringify(DONE)); }catch{} }

function renderHome(){
  const root=document.getElementById("scene-root");
  const cards=WEEKMETA.map((m,i)=>{
    const slot=loadKey(slotKey(i)), cp=loadKey(cpKey(i)), done=DONE[i];
    const inProg=slot&&slot.stage==="play"&&!(slot.dayEnded&&slot.day===4);
    const status=done&&!inProg?`<span class="pill p2">Completed · score ${done.avg}</span>`:inProg?`<span class="pill p1">In progress · ${DAYNAMES[slot.day].slice(0,3)} ${slot.dayEnded?"(day done)":fmt(slot.min)}</span>`:`<span class="pill" style="background:var(--sunk)">Not started</span>`;
    return `<div class="wk"><div class="row" style="justify-content:space-between"><span class="eyebrow">Week ${i+1}</span>${status}</div>
      <h2>${m.title}</h2><p class="small">${m.desc}</p>
      <div class="chips">${m.skills.map(s=>`<span>${s}</span>`).join("")}</div>
      ${m.ai?`<p class="small muted">Optional AI conversations on claude.ai</p>`:`<p class="small muted">No AI needed</p>`}
      <div class="row">${inProg?`<button class="btn primary sm" data-act="wk-continue" data-w="${i}">Continue</button>`:""}
        <button class="btn ${inProg?"ghost":"primary"} sm" data-act="wk-start" data-w="${i}">${inProg?"Start over":done?"Play again":"Start"}</button>
        ${inProg&&cp&&cp.day>0?`<button class="btn ghost sm" data-act="wk-day" data-w="${i}">Restart ${DAYNAMES[cp.day]}</button>`:""}</div></div>`; }).join("");
  root.innerHTML=`<div class="scrim"><div class="sheet home" role="dialog" aria-label="Home">
    <div class="stack"><span class="eyebrow">Brightside PM Sim</span>
      <h1>Learn product management by doing the job.</h1>
      <p class="lede">You're the new Product Manager at Brightside, a scheduling app for small salons and clinics. Each week is a new challenge. Play them in order, or jump to any week.</p></div>
    <div class="weeks">${cards}</div>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <details class="howto"><summary><b>How to play</b></summary><div class="keys" style="margin-top:8px">
        <div><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> or click the floor: walk</div><div>Click a person, or press <kbd>E</kbd> when near: talk</div>
        <div>Walk to your desk and press <kbd>E</kbd>: open your laptop</div><div>Meetings start on time. Walk into the room to join.</div>
        <div><kbd>P</kbd> pauses. ⏩ skips to the next event. <b>Home</b> (top bar) saves and comes back here.</div></div></details>
      <div class="stack" style="gap:8px">
        <label class="check" for="noai"><input type="checkbox" id="noai" data-act="noai" ${NOAI?"checked":""}><span><b>Play without AI.</b> Every conversation uses written reply choices.</span></label>
        <div class="row"><button class="btn ghost sm" data-act="load-file">Load save file</button><input type="file" id="load-input" accept=".json,application/json" hidden><span class="small muted">Progress autosaves in this browser.</span></div>
      </div></div>
  </div></div>`;
}
function goHome(){
  saveNow(); clearInterval(UI.incT); clearInterval(UI.binT); clearInterval(UI.launchT);
  UI.pc=null; UI.dialog=null; UI.scene=null; UI.coach=null; UI.summary=null; UI.sel=null;
  S=fresh(); DAYS=WEEK1; render();
}
Object.assign(ACT,{

  "wk-continue":el=>{ const s=loadKey(slotKey(+el.dataset.w)); if(s) resumeSave(s); },
  "wk-start":el=>{ const w=+el.dataset.w, slot=loadKey(slotKey(w)), live=slot&&slot.stage==="play"&&!(slot.dayEnded&&slot.day===4);
    if(live&&!el.dataset.confirm){ el.dataset.confirm="1"; el.textContent="Click again to erase this week's progress"; return; }
    startWeek(w,false); },
  "wk-day":el=>{ const cp=loadKey(cpKey(+el.dataset.w)); if(cp){ S=cp; DAYS=WEEKS[S.week]; startDay(); } },

});

/* ================= Saving ================= */
let downloadsNS=null;
(async()=>{ try{ if(window.claude&&window.claude.use) downloadsNS=await window.claude.use("downloads"); }catch{} })();
function resumeSave(saved){
  S=saved; DAYS=WEEKS[S.week||0]; S.stage="play"; lastMin=-1;
  UI.pc=null; UI.dialog=null; UI.scene=null; UI.coach=null; UI.summary=null; UI.sel=null;
  npcsHome(); if(S.pos){ P.x=S.pos[0]; P.y=S.pos[1]; } P.path=[]; P.pending=null;
  // a meeting that was in progress when you left restarts when you're back in the room
  DAYS[S.day].meetings.forEach(m=>{ const k=S.day+":"+m.id; if(S.attended[k]&&!S.goals[m.goal]){ delete S.attended[k]; S.min=Math.min(S.min,m.at()); } });
  document.getElementById("scene-root").innerHTML="";
  render(); renderClock();
  if(S.dayEnded){ UI.summary={kind:S.day===4?"week":"end"}; renderSummary(); return; }
  const dd=DAYS[S.day];
  if(dd.onStart&&!S.goals[dd.startGoal]){ dd.onStart(); return; }
  if(S.week===0&&S.day===3&&S.fired["3:e1"]&&!S.goals.thu_dana) setTimeout(danaWalksOver,600);
  S.paused=true; renderHUD(); toast("Welcome back! The game is paused. Press Resume when you're ready.");
}
async function exportSave(){
  S.pos=[P.x,P.y];
  const data=JSON.stringify({app:"brightside-pm-sim",version:1,savedAt:new Date().toISOString(),state:S});
  const name=`brightside-week${S.week+1}-${DAYNAMES[S.day].toLowerCase()}.json`;
  if(downloadsNS){
    try{ await downloadsNS.save({filename:name,data}); toast("Save file downloaded."); }
    catch(e){ if(e&&e.code!=="declined") toast("Couldn't download here. Your progress still autosaves in this browser."); }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Save file downloaded: "+name);
}
function importSave(file){
  const r=new FileReader();
  r.onload=()=>{ let o=null; try{ o=JSON.parse(r.result); }catch{}
    const st=o&&o.app==="brightside-pm-sim"&&o.state;
    if(!st||typeof st.day!=="number"||st.day<0||st.day>4||!st.meters||!st.goals){ toast("That file isn't a Brightside save. Choose a .json file made with Save file."); return; }
    resumeSave(st); saveNow(); toast("Save loaded: Week "+((st.week||0)+1)+", "+DAYNAMES[st.day]+".");
  };
  r.onerror=()=>toast("Couldn't read that file.");
  r.readAsText(file);
}
Object.assign(ACT,{
  "resume-auto":()=>{ if(AUTO) resumeSave(AUTO); },
  export:()=>exportSave(),
  "load-file":()=>document.getElementById("load-input")?.click(),
});
document.addEventListener("change",e=>{ if(e.target.id==="load-input"&&e.target.files&&e.target.files[0]) importSave(e.target.files[0]); });

function render(){ renderHUD(); renderSide(); renderPC(); renderDialog(); renderCoach(); if(S.stage==="intro"){ document.getElementById("scene-root").innerHTML=""; renderHome(); } }
render();
requestAnimationFrame(frame);
</script>
